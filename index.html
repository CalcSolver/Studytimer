<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus & Study Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 20px;
      position: relative;
    }

    /* Top Digital Clock */
    .digital-clock {
      position: absolute;
      top: 24px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 1px;
      background-color: #1e293b;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    .timer-card {
      background-color: #1e293b;
      padding: 36px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 100%;
      max-width: 440px;
      border: 1px solid #334155;
    }

    /* Editable Text Fields */
    .editable-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
      outline: none;
      padding: 4px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .editable-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
      outline: none;
      padding: 4px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .editable-title:hover, .editable-desc:hover,
    .editable-title:focus, .editable-desc:focus {
      background-color: #334155;
    }

    .time-display {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    .input-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .time-input {
      width: 140px;
      padding: 10px;
      font-size: 1.1rem;
      text-align: center;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      outline: none;
    }

    .time-input:focus {
      border-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    /* Unlocked Proxy Container */
    .unlocked-view {
      display: none;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #0f172a;
      z-index: 100;
    }

    .navbar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .url-form {
      display: flex;
      flex: 1;
      gap: 10px;
    }

    .url-input {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.95rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      outline: none;
    }

    .url-input:focus {
      border-color: #38bdf8;
    }

    .btn-go {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <main class="app-viewport" id="timerViewport">
    <!-- Live Digital Clock -->
    <div class="digital-clock" id="digitalClock">00:00:00 AM</div>

    <div class="timer-card">
      <!-- Editable Title & Description -->
      <h1 class="editable-title" contenteditable="true" spellcheck="false">Study & Focus Timer</h1>
      <p class="editable-desc" contenteditable="true" spellcheck="false">Click here to edit your goal or session notes</p>
      
      <div class="time-display" id="timerDisplay">25:00</div>

      <div class="input-group">
        <input 
          type="text" 
          id="timeInput" 
          class="time-input" 
          placeholder="MM:SS" 
          value="25:00"
          maxlength="5"
          autocomplete="off"
        />
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="startBtn" onclick="handleStart()">Start</button>
        <button class="btn btn-secondary" id="pauseBtn" onclick="togglePause()" disabled>Pause</button>
        <button class="btn btn-secondary" id="resetBtn" onclick="resetTimer()">Reset</button>
      </div>
    </div>
  </main>

  <div class="unlocked-view" id="unlockedView">
    <header class="navbar">
      <form class="url-form" onsubmit="loadFrameUrl(event)">
        <input 
          type="text" 
          id="targetUrlInput" 
          class="url-input" 
          placeholder="Enter a URL or search term..." 
          required 
          autocomplete="off"
        />
        <button type="submit" class="btn-go">Go</button>
      </form>
    </header>

    <div class="iframe-container">
      <iframe 
        id="contentFrame"
        sandbox="allow-scripts allow-forms allow-same-origin allow-modals allow-popups-to-escape-sandbox"
        src="about:blank"
        title="Content View"
      ></iframe>
    </div>
  </div>

  <script>
    const SECRET_TIME = "12:34";
    const PROXY_PREFIX = "google.com";

    let timerInterval = null;
    let totalSeconds = 0;
    let isPaused = false;
    let isRunning = false;

    // Digital Clock Functionality
    function updateDigitalClock() {
      const now = new Date();
      document.getElementById("digitalClock").innerText = now.toLocaleTimeString();
    }
    setInterval(updateDigitalClock, 1000);
    updateDigitalClock();

    // Timer Controls
    function handleStart() {
      const inputVal = document.getElementById("timeInput").value.trim();

      if (inputVal === SECRET_TIME) {
        unlockHiddenContainer();
        return;
      }

      if (isRunning) return;

      const parts = inputVal.split(":");
      if (parts.length !== 2) return;

      const mins = parseInt(parts[0], 10);
      const secs = parseInt(parts[1], 10);

      if (isNaN(mins) || isNaN(secs)) return;

      totalSeconds = (mins * 60) + secs;
      if (totalSeconds <= 0) return;

      startCountdown();
    }

    function startCountdown() {
      isRunning = true;
      isPaused = false;
      document.getElementById("startBtn").disabled = true;
      document.getElementById("pauseBtn").disabled = false;
      document.getElementById("pauseBtn").innerText = "Pause";

      timerInterval = setInterval(() => {
        if (!isPaused) {
          if (totalSeconds <= 0) {
            resetTimer();
            return;
          }
          totalSeconds--;
          updateDisplay();
        }
      }, 1000);
    }

    function togglePause() {
      if (!isRunning) return;

      isPaused = !isPaused;
      const pauseBtn = document.getElementById("pauseBtn");

      if (isPaused) {
        pauseBtn.innerText = "Resume";
      } else {
        pauseBtn.innerText = "Pause";
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      isPaused = false;
      
      const inputVal = document.getElementById("timeInput").value.trim();
      document.getElementById("timerDisplay").innerText = inputVal || "25:00";
      
      document.getElementById("startBtn").disabled = false;
      document.getElementById("pauseBtn").disabled = true;
      document.getElementById("pauseBtn").innerText = "Pause";
    }

    function updateDisplay() {
      const m = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const s = String(totalSeconds % 60).padStart(2, "0");
      document.getElementById("timerDisplay").innerText = `${m}:${s}`;
    }

    function unlockHiddenContainer() {
      clearInterval(timerInterval);
      document.getElementById("timerViewport").style.display = "none";
      document.getElementById("unlockedView").style.display = "flex";
    }

    function loadFrameUrl(event) {
      event.preventDefault();

      const input = document.getElementById("targetUrlInput").value.trim();
      if (!input) return;

      let destination = "";
      const urlPattern = /^(https?:\/\/)?([\w.-]+)+[\w\-_~:/?#[\]@!$&'()*+,;=.]+$/i;
      const hasProtocol = /^https?:\/\//i.test(input);

      if (hasProtocol) {
        destination = input;
      } else if (urlPattern.test(input) && input.includes(".")) {
        destination = "https://" + input;
      } else {
        destination = "https://www.google.com/search?q=" + encodeURIComponent(input);
      }

      document.getElementById("contentFrame").src = PROXY_PREFIX + destination;
    }
  </script>
</body>
</html>
